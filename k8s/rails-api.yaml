apiVersion: apps/v1
kind: Deployment
metadata:
  name: rails-api
  namespace: kube-demo
  labels:
    app: rails-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rails-api
  template:
    metadata:
      labels:
        app: rails-api
    spec:
      containers:
        - name: rails-api
          image: kube-demo/rails-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: RAILS_ENV
              value: production
            - name: SECRET_KEY_BASE
              value: demo-secret-key-base-change-in-production
            - name: REDIS_URL
              value: redis://redis:6379/0
          readinessProbe:
            httpGet:
              path: /api/v1/health_check
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rails-api
  namespace: kube-demo
  labels:
    app: rails-api
spec:
  selector:
    app: rails-api
  ports:
    - port: 3000
      targetPort: 3000
